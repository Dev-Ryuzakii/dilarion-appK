# AppVeyor: build the production Windows MSI (+ NSIS exe) for Dilarion desktop.
# Requires a Tauri signing key (createUpdaterArtifacts is on): add
# TAURI_SIGNING_PRIVATE_KEY as a SECURE environment variable in the AppVeyor
# project settings (same value as the GitHub secret).
image: Visual Studio 2022

environment:
  nodejs_version: "20"
  # AppVeyor sets CI=True (capitalized); Tauri's --ci flag only accepts lowercase.
  CI: "true"
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
  # Put Cargo on PATH for every build phase (rustup installs here).
  PATH: 'C:\Users\appveyor\.cargo\bin;%PATH%'

install:
  - ps: Install-Product node $env:nodejs_version
  # Rust is not preinstalled on this image — install via rustup.
  - ps: Invoke-WebRequest -Uri https://win.rustup.rs/x86_64 -OutFile rustup-init.exe
  - cmd: rustup-init.exe -y --profile minimal --default-toolchain stable
  - cmd: rustc --version && cargo --version
  - cmd: cd desktop && npm ci && cd ..

build_script:
  - cmd: cd desktop && npm run tauri build && cd ..

artifacts:
  - path: desktop\src-tauri\target\release\bundle\msi\*.msi
    name: msi
  - path: desktop\src-tauri\target\release\bundle\nsis\*.exe
    name: nsis
