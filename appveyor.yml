# AppVeyor: build the production Windows MSI (+ NSIS exe) for Dilarion desktop.
# The build points at production (apidilarion) via the default Tauri config.
# createUpdaterArtifacts is on, so a Tauri signing key is required:
# add TAURI_SIGNING_PRIVATE_KEY as a SECURE environment variable in the
# AppVeyor project settings (same value as the GitHub secret).
image: Visual Studio 2022

environment:
  nodejs_version: "20"
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

install:
  - ps: Install-Product node $env:nodejs_version
  - cmd: rustup default stable
  - cmd: rustup target add x86_64-pc-windows-msvc
  - cmd: cd desktop && npm ci && cd ..

build_script:
  - cmd: cd desktop && npm run tauri build && cd ..

artifacts:
  - path: desktop\src-tauri\target\release\bundle\msi\*.msi
    name: msi
  - path: desktop\src-tauri\target\release\bundle\nsis\*.exe
    name: nsis

# No deploy step: these artifacts are for manual distribution. OTA updates are
# published by the GitHub Actions workflow, not AppVeyor.
