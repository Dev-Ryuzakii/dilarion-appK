<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dilarion</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0c0c0c;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
      max-width: 340px;
      width: 100%;
    }

    .logo {
      width: 80px;
      height: 80px;
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid #1f1f1f;
    }

    .logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    h1 {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.04em;
      color: #fff;
      text-align: center;
    }

    .steps {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .step {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      padding: 0.85rem 1rem;
      background: #141414;
      border: 1px solid #1e1e1e;
      border-radius: 12px;
    }

    .step-num {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #c0392b;
      color: #fff;
      font-size: 0.65rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .step span {
      font-size: 0.8rem;
      color: #9ca3af;
      line-height: 1.4;
    }

    .step span strong {
      color: #d1d5db;
      font-weight: 600;
    }

    .btn-group {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      width: 100%;
      color: #fff;
      text-decoration: none;
      border-radius: 14px;
      padding: 1rem;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      transition: background 0.15s, transform 0.1s;
    }

    .btn-android { background: #c0392b; }
    .btn-android:hover { background: #a93226; transform: translateY(-1px); }

    .btn-windows { background: #0078d4; }
    .btn-windows:hover { background: #005fa3; transform: translateY(-1px); }

    .btn:active { transform: translateY(0); }

    .btn-label {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      line-height: 1.2;
    }
    .btn-label small {
      font-size: 0.65rem;
      font-weight: 400;
      opacity: 0.8;
    }

    footer {
      font-size: 0.7rem;
      color: #3f3f3f;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="wrap">

    <div class="logo">
      <img src="logo.jpg" alt="Dilarion" />
    </div>

    <h1>Dilarion</h1>

    <div class="steps">
      <div class="step">
        <span class="step-num">1</span>
        <span>Tap <strong>Download</strong> below to get the APK</span>
      </div>
      <div class="step">
        <span class="step-num">2</span>
        <span>Open <strong>Downloads</strong> and tap <strong>Dilarion.apk</strong></span>
      </div>
      
      <div class="step">
        <span class="step-num">3</span>
        <span>Tap <strong>Install</strong> and open Dilarion</span>
      </div>
    </div>

    <div class="btn-group">
      <a class="btn btn-android" href="dilarion.apk" download="Dilarion.apk">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        <div class="btn-label">
          <span>Download for Android</span>
          <small>APK • Direct install</small>
        </div>
      </a>

      <a class="btn btn-windows" href="dilarion-windows.msi" download="Dilarion.msi">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M3 12V6.75l6-1.32v6.57H3zm17 0V5.25L10.5 3.38v8.62H20zM3 13h6v5.84L3 17.25V13zm7.5.06V21.5L20 19.3V13H10.5z"/>
        </svg>
        <div class="btn-label">
          <span>Download for Windows</span>
          <small>MSI installer • Windows 10/11</small>
        </div>
      </a>
    </div>

    <footer>&copy; 2025 Dilarion</footer>

  </div>
</body>
</html>
