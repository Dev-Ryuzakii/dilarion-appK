name: Dilarion
options:
  bundleIdPrefix: com.dilarion
configs:
  Debug: debug
  Release: release
  Staging: release
targets:
  Dilarion:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - Dilarion/Sources
      - Dilarion/Resources
    dependencies:
      - package: WebRTC
        product: WebRTC
      - package: LiveKit
        product: LiveKit
    # Debug/Release point at production; Staging points at the test VPS
    # (testdilarion.eibstratoc.com) so testers can run a separate build
    # without touching what's already on production users' devices.
    configFiles:
      Debug: Config-Production.xcconfig
      Release: Config-Production.xcconfig
      Staging: Config-Staging.xcconfig
    info:
      path: Dilarion/Info.plist
      properties:
        CFBundleDisplayName: "Dilarionn"
        CFBundleName: "Dilarionn"
        APIBaseURL: "$(API_BASE_URL)"
        WSBaseURL: "$(WS_BASE_URL)"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: true
        NSMicrophoneUsageDescription: "Dilarion needs microphone access for voice notes and calls."
        NSCameraUsageDescription: "Dilarion needs camera access for video calls."
        NSFaceIDUsageDescription: "Dilarion uses Face ID to lock the app and protect security changes."
    settings:
      TARGETED_DEVICE_FAMILY: 1
      GENERATE_INFOPLIST_FILE: false
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      DEVELOPMENT_TEAM: 5297W9L44K
      CODE_SIGN_STYLE: Automatic
packages:
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    from: 125.0.0
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift.git
    from: 2.0.0
schemes:
  Dilarion:
    build:
      targets:
        Dilarion: all
    run:
      config: Debug
    archive:
      config: Release
  Dilarion Staging:
    build:
      targets:
        Dilarion: all
    run:
      config: Staging
    archive:
      config: Staging
